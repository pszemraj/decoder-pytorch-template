[package]
name = "burn-llama" # TODO: standardize around decoder-burn project-wide name
version = "0.1.0"
edition = "2021"

[dependencies]
# Burn 0.19 with modular backend selection
burn = { version = "0.19", default-features = false, features = [
    "std",
    "train",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "=0.0.7"

# CLI and utilities
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
half = "2"

# Data handling
flate2 = "1.0"
rand = "0.8"
indicatif = "0.17"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.dev]
incremental = false

[profile.test]
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
panic = "abort"

[profile.bench]
inherits = "release"

[features]
default = ["backend-wgpu"]
backend-wgpu = ["burn/wgpu", "burn/fusion", "burn/tui"]
backend-cuda = ["burn/cuda", "burn/fusion"]
backend-cpu = ["burn/ndarray"]
