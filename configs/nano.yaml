# Lifted directly from nano_python.yaml (L6 · H384 · ~9M params)
model:
  vocab_size: 256
  hidden_size: 384
  n_layers: 6
  n_heads: 6
  intermediate_size: 576
  ffn_multiplier: 1.5
  ffn_multiple_of: 256
  rope_theta: 10000.0
  max_position_embeddings: 512
  dropout: 0.0
  tie_embeddings: true

train_data: data/enwik8.gz
val_data: data/enwik8.gz

# Training schedule (matches python nano config)
batch_size: 1
sequence_length: 512
num_batches: 10000
learning_rate: 0.0003
weight_decay: 0.0003
gradient_clip: 1.0
gradient_accumulation_steps: 16

# Validation / generation cadence
validate_every: 250
val_batches: 20
generate_every: 250
save_every: 2000

# Generation settings
generation_length: 256
generation_prompt_length: 128
temperature: 1.0
min_p: 0.1

# Misc
seed: 7
output_dir: runs/nano
mixed_precision: true
gradient_checkpointing: false
