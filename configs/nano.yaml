model:
  vocab_size: 256
  hidden_size: 384
  n_layers: 6
  n_heads: 6
  intermediate_size: 1536
  rope_theta: 10000.0
  max_position_embeddings: 512
  dropout: 0.0

train_data: data/enwik8.gz
val_data: data/enwik8.gz

batch_size: 1
sequence_length: 512
num_epochs: 5
learning_rate: 0.0003
weight_decay: 0.0003
gradient_clip: 1.0
gradient_accumulation_steps: 16
val_frequency: 1
sample_frequency: 5
num_workers: 0
train_steps_per_epoch: 200
val_steps: 50
seed: 7
output_dir: runs/nano
mixed_precision: true
warmup_steps: 500
gradient_checkpointing: false
