model:
  vocab_size: 256
  hidden_size: 128
  n_layers: 2
  n_heads: 4
  intermediate_size: 512
  rope_theta: 10000.0
  max_position_embeddings: 128
  dropout: 0.0
  tie_embeddings: true

train_data: data/enwik8.gz
val_data: data/enwik8.gz

batch_size: 2
sequence_length: 128
num_batches: 10
learning_rate: 0.001
weight_decay: 0.0
gradient_clip: 1.0
gradient_accumulation_steps: 2
validate_every: 5
val_batches: 5
generate_every: 5
save_every: 5
generation_length: 50
generation_prompt_length: 64
temperature: 1.0
min_p: 0.1
seed: 7
output_dir: runs/test
mixed_precision: false
gradient_checkpointing: false
