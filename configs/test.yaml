model:
  vocab_size: 256
  hidden_size: 128
  n_layers: 2
  n_heads: 4
  intermediate_size: 512
  rope_theta: 10000.0
  max_position_embeddings: 128
  dropout: 0.0
  tie_embeddings: true

train_data: data/enwik8.gz
val_data: data/enwik8.gz

batch_size: 2
sequence_length: 128
num_epochs: 1
learning_rate: 0.001
weight_decay: 0.0
gradient_clip: 1.0
gradient_accumulation_steps: 2
val_frequency: 1
sample_frequency: 5
num_workers: 0
train_steps_per_epoch: 10
val_steps: 5
seed: 7
output_dir: runs/test
mixed_precision: false
warmup_steps: 0
gradient_checkpointing: false
