# Benchmark config - 1000 steps with consistent seed
model:
  vocab_size: 256
  hidden_size: 384
  n_layers: 6
  n_heads: 6
  intermediate_size: 576
  ffn_multiplier: 1.5
  ffn_multiple_of: 256
  rope_theta: 10000.0
  max_position_embeddings: 512
  dropout: 0.0
  tie_embeddings: true

train_data: data/enwik8.gz
val_data: data/enwik8.gz

batch_size: 4
sequence_length: 512
num_batches: 1000
learning_rate: 0.0003
weight_decay: 0.0003
gradient_clip: 1.0
gradient_accumulation_steps: 4

validate_every: 200
val_batches: 20
generate_every: 500
save_every: 1000

generation_length: 64
generation_prompt_length: 32
temperature: 0.9
min_p: 0.1

seed: 42
output_dir: runs/benchmark
mixed_precision: false
gradient_checkpointing: false
